name: FloatingMascot
options:
  bundleIdPrefix: com.yasharth.mascot
  deploymentTarget:
    macOS: "14.0"
targets:
  FloatingMascot:
    type: application
    platform: macOS
    sources:
      - path: FloatingMascotApp
    entitlements:
      path: FloatingMascotApp.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yasharth.mascot.app
      INFOPLIST_FILE: FloatingMascotApp/Info.plist
      GENERATE_INFOPLIST_FILE: false
      SWIFT_VERSION: "5.0"
      CODE_SIGN_STYLE: Automatic
      ENABLE_HARDENED_RUNTIME: true
      COMBINE_HIDPI_IMAGES: true
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: FloatingMascotWidgetExtension

  FloatingMascotWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: FloatingMascotWidgetExtension
    entitlements:
      path: FloatingMascotWidgetExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yasharth.mascot.app.widget
      INFOPLIST_FILE: FloatingMascotWidgetExtension/Info.plist
      GENERATE_INFOPLIST_FILE: false
      SWIFT_VERSION: "5.0"
      CODE_SIGN_STYLE: Automatic
      ENABLE_HARDENED_RUNTIME: true
      COMBINE_HIDPI_IMAGES: true
